[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
# Aevum runs the Shanghai EVM (chain 44005): no Cancun opcodes.
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
aevum = "https://rpc-test.qday.info"

[fmt]
line_length = 110
